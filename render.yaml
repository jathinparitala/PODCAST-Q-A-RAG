services:
  - type: web
    name: podcast-qa-rag
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: gemini
      - key: AI_API_KEY
        sync: false
